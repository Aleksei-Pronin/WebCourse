<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список задач</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="node_modules/vue/dist/vue.global.js"></script>
    <script defer src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
<div id="app">
    <div class="main-block mx-auto p-4 bg-white rounded-3">
        <h1 class="text-center text-dark fs-4 mb-3">Список задач</h1>

        <form @submit.prevent="addTodoItem" class="mb-2">
            <label for="new-todo-item-text-field" class="form-label text-secondary small ps-1 mb-2">
                Введите текст задачи
            </label>

            <div class="mb-3">
                <input id="new-todo-item-text-field" class="form-control"
                       :class="{ 'is-invalid': isNewTodoItemTextInvalid }"
                       v-model="newTodoItemText">
                <div class="invalid-feedback" v-if="isNewTodoItemTextInvalid">Необходимо заполнить поле</div>
            </div>

            <button class="btn btn-primary w-100 py-2">Создать</button>
        </form>

        <ul class="todo-list list-unstyled mb-0">
            <li v-for="item in items" :key="item.id"
                class="d-flex justify-content-between align-items-center p-2 border rounded mb-2">
                <template v-if="item.isEditing">
                    <form @submit.prevent="saveTodoItem(item)" class="w-100">
                        <div class="mb-2">
                            <input class="form-control" :class="{ 'is-invalid': item.isInvalid }"
                                   v-model="item.editingTodoItemText">
                            <div class="invalid-feedback" v-if="item.isInvalid">Необходимо заполнить поле</div>
                        </div>

                        <button class="btn btn-success py-1 px-3 me-1">
                            Сохранить
                        </button>

                        <button type="button" class="btn btn-secondary py-1 px-3" @click="cancelEdit(item)">
                            Отменить
                        </button>
                    </form>
                </template>

                <template v-else>
                    <span class="flex-grow-1 me-2">{{ item.text }}</span>

                    <div class="text-nowrap">
                        <button type="button" class="btn btn-primary btn-sm px-3 me-1" @click="startEditing(item)">
                            Редактировать
                        </button>

                        <button type="button" class="btn btn-danger btn-sm px-3" @click="confirmRemove(item)">
                            Удалить
                        </button>
                    </div>
                </template>
            </li>
        </ul>
    </div>

    <div ref="confirmDeleteDialog" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-3">
                <div class="modal-header px-4 py-3">
                    <h5 class="modal-title text-dark">Удаление задачи</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>

                <div class="modal-body px-4 py-3 text-secondary">Вы действительно хотите удалить эту задачу?</div>

                <div class="modal-footer px-4 pt-2 pb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Отменить
                    </button>

                    <button type="button" class="btn btn-danger" @click="removeTodoItem">
                        Удалить
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
