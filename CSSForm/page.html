<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отправить заявку</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-container">
    <div class="container">
        <div class="form-title">
            <h1>Отправить заявку</h1>
        </div>
    </div>

    <form class="beige-color" action="/submit" method="POST">
        <div class="container">
            <div class="form-field">
                <label for="client-name">Ваше имя</label>
                <input type="text" id="client-name" class="input-field" placeholder="Ваше имя *"
                       name="clientName" required>
            </div>

            <div class="form-field">
                <label for="client-phone">Ваш номер телефона</label>
                <input type="tel" id="client-phone" class="input-field" placeholder="Ваш номер телефона *"
                       name="clientPhone" required>
            </div>

            <div class="form-field">
                <label for="client-email">Ваш email или VK</label>
                <input type="text" id="client-email" class="input-field" placeholder="Ваш email или VK *"
                       name="clientEmail" required>
            </div>

            <div class="form-field">
                <label for="client-comment">Комментарий</label>
                <textarea class="input-field" id="client-comment" rows="5"
                          placeholder="Комментарий (не обязательно)" name="clientComment"></textarea>
            </div>

            <div class="callback-field">
                Заполните и отправьте форму, и мы перезвоним Вам по указанному номеру
            </div>

            <button type="submit" class="submit-button">Отправить заявку</button>
        </div>
    </form>
</div>
</body>
</html>
