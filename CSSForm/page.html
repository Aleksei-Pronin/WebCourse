<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отправить заявку</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-container">
    <div class="container">
        <div class="form-title">
            <h1>Отправить заявку</h1>
        </div>
    </div>

    <form action="/submit" method="POST">
        <div class="beige-color">
            <div class="container">
                <div class="form-field">
                    <label for="form_clientName">Ваше имя</label>
                    <input type="text" id="form_clientName" class="input-field" placeholder="Ваше имя *"
                           name="clientName" required>
                </div>

                <div class="form-field">
                    <label for="form_clientPhone">Ваш номер телефона</label>
                    <input type="tel" id="form_clientPhone" class="input-field" placeholder="Ваш номер телефона *"
                           name="clientPhone" required>
                </div>

                <div class="form-field">
                    <label for="form_clientEmail">Ваш email или VK</label>
                    <input type="text" id="form_clientEmail" class="input-field" placeholder="Ваш email или VK *"
                           name="clientEmail" required>
                </div>

                <div class="form-field">
                    <label for="form_clientComment">Комментарий</label>
                    <textarea class="input-field" id="form_clientComment" rows="5"
                              placeholder="Комментарий (не обязательно)" name="clientComment"></textarea>
                </div>

                <div class="callback-field">
                    Заполните и отправьте форму, и мы перезвоним Вам по указанному номеру
                </div>

                <button type="submit" class="submit-button">Отправить заявку</button>
            </div>
        </div>
    </form>
</div>
</body>
</html>
